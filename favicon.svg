<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cartGrad)" />
  
  <!-- Shopping Cart Body -->
  <g filter="url(#glow)">
    <!-- Cart Lines -->
    <path d="M12 16h6l5.5 24h21l4-16H20.5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wheels -->
    <circle cx="25" cy="48" r="3.5" fill="#ffffff" />
    <circle cx="43" cy="48" r="3.5" fill="#ffffff" />
    
    <!-- AI Shield / Sparkle Star inside the cart -->
    <path d="M33 21l1.8 4.2L39 27l-4.2 1.8L33 33l-1.8-4.2L27 27l4.2-1.8z" fill="#fde047" />
  </g>
</svg>
